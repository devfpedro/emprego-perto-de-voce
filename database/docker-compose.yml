services:
  db:
    image: postgis/postgis:17-3.5
    container_name: emprego-perto-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: emprego_perto_de_voce
      POSTGRES_USER: emprego_user
      POSTGRES_PASSWORD: emprego_dev_123
    ports:
      - "5433:5432"
    volumes:
      - emprego_perto_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

volumes:
  emprego_perto_data: